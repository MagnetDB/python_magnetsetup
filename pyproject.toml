[project]
name = "python-magnetsetup"
version = "0.1.1"
description = "Python helpers to setup and run HiFiMagnet simulations"
authors = [
    {name = "Christophe Trophime", email = "christophe.trophime@lncmi.cnrs.fr"},
    {name = "Romain Vallet", email = "romain.vallet@lncmi.cnrs.fr"},
    {name = "Jeremie Muzet", email = "jeremie.muzet@lncmi.cnrs.fr"},
    {name = "Remi Caumette", email = "remicaumette@icloud.com"}
]
requires-python = ">=3.11"
dependencies = [
    "python-magnetgeo",
    "fabric>=2.7.0,<3.0.0",
    "Pint>=0.24,<0.25",
    "python-decouple>=3.6,<4.0",
    "requests>=2.27.1,<3.0.0",
    "chevron>=0.13.1,<0.14.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov",
    "ruff",
    "ty",
    "bandit[toml]",
    "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.setuptools.packages.find]
include = ["python_magnetsetup*"]

[tool.setuptools.package-data]
"python_magnetsetup" = ["*.json", "templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["python_magnetsetup"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = ["build", "debian", "docs", "examples"]

[tool.ty.rules]
# python_magnetgeo, fabric, chevron... are not installed in the pre-commit
# environment, so imports cannot be resolved there
unresolved-import = "warn"

# Bandit configuration
[tool.bandit]
exclude_dirs = [
    "tests",
    "build",
    "debian",
    "docs",
    "examples",
    ".venv",
    "venv",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
